{% extends 'jobs/base.html' %}
{% block content %}
<div class="vacancy-detail">
    <h2>{{ vacancy.title }}</h2>
    <p class="company">{{ vacancy.company }}</p>
    <p class="salary">{{ vacancy.salary }}</p>
    <p class="description">{{ vacancy.description }}</p>
    <a href="{% url 'index' %}" class="btn back-btn">Back</a>
</div>
{% endblock %}
