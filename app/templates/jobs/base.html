<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ site_title|default:"Job Search" }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'jobs/style.css' %}">
</head>
<body>
    <div class="container">
        <header class="main-header">
            <div class="logo-block">
                <span class="logo-icon">🔍</span>
                <span class="logo-text"><span class="logo-bold">Job</span><span class="logo-accent">Scout</span></span>
                <span class="logo-slogan">Find the job. Build the future.</span>
            </div>
            <nav class="main-nav">
                <a href="{% url 'home' %}" class="nav-link">Home</a>
                <a href="{% url 'vacancies' %}" class="nav-link">Jobs</a>
                <a href="{% url 'articles' %}" class="nav-link">Articles</a>
                <a href="{% url 'add_article' %}" class="nav-link">Add Article</a>
                <a href="{% url 'about' %}" class="nav-link">About</a>
                
                <a href="{% url 'admin:index' %}" class="nav-btn">Log In</a>
                <a href="{% url 'admin:index' %}" class="nav-btn nav-btn-accent">Sign Up</a>
            </nav>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
